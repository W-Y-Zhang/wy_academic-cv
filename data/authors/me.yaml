experience:
  - role: Master's Thesis Research
    org: High Performance Humanoid Technologies (H²T), Karlsruhe Institute of Technology
    start: 2026-08-01
    summary: |
      **Cross-Embodiment Bimanual VLA Adaptation with Object-centered Task Representations**

      Collected approximately **10 hours of ARMAR-6 demonstrations** and converted them to LeRobot format. Trained a **GR00T N1.7 baseline on 80 demonstrations for 10,000 training steps**; initial offline checks use six training trajectories from a single task, without object-pose inputs.

      Built an offline **SAM3 + FoundationPose** pipeline to extract object trajectories from calibrated RGB-D recordings, and **three Isaac Lab environments** for ARMAR-6, ARMAR-7, and bimanual Franka. Designed a cross-embodiment evaluation protocol using task success rates, paired-bootstrap 95% confidence intervals, and human-annotated failure analysis.

      **Supervisor:** Prof. Tamim Asfour · **Advisor:** Dr. David Schneider.

      [Project details and current progress](/wy_academic-cv/projects/object-centric-vla/)
  - role: Research Assistant
    org: Institute for Material Handling and Logistics, Karlsruhe Institute of Technology
    start: 2025-06-01
    end: 2026-05-31
    summary: |
      **Panoptic Segmentation for Robotic Perception**

      Upgraded the CUDA environment for panoptic-segmentation baselines, adapted them in Docker, and tuned hyperparameters on the **ARIBIC dataset**, improving **panoptic quality (PQ) from approximately 10% to 30%**.

      **Dual-LiDAR AGV Localization and Mapping**

      Developed **synchronized front/rear LiDAR fusion** with coordinate transforms and 360° scan resampling for online ROS and offline processing. Adapted an open-source FastSLAM pipeline and benchmarked it against **GMapping + AMCL** on the same real-world AGV dataset; trajectory comparisons showed more consistent localization with GMapping + AMCL.

      **Supervisor:** Hao Pang.

