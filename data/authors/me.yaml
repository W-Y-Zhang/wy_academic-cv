bio: |
  I am an M.Sc. student in Mechatronics and Information Technology at Karlsruhe Institute of Technology (KIT), specializing in Robotics.

  I am conducting my Master's thesis at [High Performance Humanoid Technologies (H²T)](https://h2t.iar.kit.edu/), Institute for Anthropomatics and Robotics, under the supervision of [Prof. Dr.-Ing. Tamim Asfour](https://h2t.iar.kit.edu/tamim-asfour.php). My research explores object-centric vision-language-action models for few-shot adaptation across robotic embodiments.

  I am seeking Ph.D. opportunities starting in **Fall 2027** in embodied AI, vision-language-action models, robot learning, and robotic manipulation.

