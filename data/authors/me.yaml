bio: |
  I am an M.Sc. student in Mechatronics and Information Technology at Karlsruhe Institute of Technology (KIT), specializing in Robotics.

  I conduct my master's thesis at [High Performance Humanoid Technologies (H²T)](https://h2t.iar.kit.edu/), under the supervision of [Prof. Dr.-Ing. Tamim Asfour](https://h2t.iar.kit.edu/tamim-asfour.php) and the guidance of Dr.-Ing. David Schneider. My research investigates object-centered task representations for cross-embodiment adaptation of bimanual vision-language-action policies, with experiments involving ARMAR-6, ARMAR-7, and bimanual Franka.

  I am seeking Ph.D. opportunities starting in **Fall 2027** in embodied AI, vision-language-action models, robot learning, and robotic manipulation.

