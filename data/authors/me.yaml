bio: |
  I am an M.Sc. student in Mechatronics and Information Technology at Karlsruhe Institute of Technology (KIT), specializing in Robotics.

  My research interests include embodied AI, robot learning, vision-language-action models, and robotic perception. My current Master's thesis focuses on object-centric VLA models for few-shot adaptation across different robotic embodiments.

